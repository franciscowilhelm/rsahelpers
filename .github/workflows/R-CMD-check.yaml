# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Sanity CI: run R CMD check on push/PR. Not CRAN-targeted, so a few
# package-specific accommodations are made (see comments below).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # Vignettes are Quarto (VignetteBuilder: quarto) and are built as part
      # of the check, so the Quarto CLI has to be on the runner.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Every declared dependency is on CRAN, so no Remotes: entry and
          # no extra GitHub packages are needed. franzpak is deliberately
          # undeclared to keep the franzpak -> rsahelpers dependency
          # one-directional; the one vignette chunk that uses it is guarded
          # by requireNamespace() and degrades to a note when it is absent.
          #
          # MplusAutomation installs from CRAN but the Mplus binary is not
          # available on the runner, so Mplus-backed tests skip unless
          # RSAHELPERS_RUN_MPLUS_TESTS=true.
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # Vignettes are built (--no-manual only skips the PDF manual, which
          # would need LaTeX). Building them here is what exercises the
          # requireNamespace("franzpak") guard in its absent state, since
          # franzpak is not installed on the runner.
          args: 'c("--no-manual", "--as-cran")'
          # Known NOTEs exist (non-CRAN package); fail only on errors/warnings.
          # One is expected and deliberate: "unstated dependencies in
          # vignettes ... franzpak". franzpak is intentionally undeclared to
          # keep the dependency one-directional, and the chunk using it is
          # guarded, so the vignette renders a note instead of the table.
          error-on: '"warning"'
          upload-snapshots: true
